<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StarCode – learn programming by playing</title>
<style>
:root{--bg:#090d1f;--panel:#141a38;--panel2:#1d2550;--line:#2e3a78;--tx:#e6e9ff;--mu:#97a0d6;--star:#ffc857;--ok:#5eead4;--bad:#fb7185;--acc:#8b9bff}
*{box-sizing:border-box;margin:0}
body{font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;background:radial-gradient(ellipse at 80% -10%,#26307a55,transparent 55%),var(--bg);color:var(--tx);min-height:100vh;line-height:1.55}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{line-height:1.2}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.logo{font-weight:800;font-size:22px;letter-spacing:.3px}.logo span{color:var(--star)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:13px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--tx);border-radius:12px;padding:10px 16px;transition:.15s}
button:hover{border-color:var(--acc);transform:translateY(-1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--star);outline-offset:2px}
.pri{background:var(--star);color:#241a00;border-color:var(--star);font-weight:700}
.pri:hover{border-color:#fff}
.ghost{background:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.hero{padding:34px 24px;text-align:center}
.hero h1{font-size:clamp(28px,5vw,44px);font-weight:800;margin-bottom:10px}
.hero p{color:var(--mu);max-width:560px;margin:0 auto 20px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.menu button{text-align:left;padding:20px;border-radius:18px;background:var(--panel)}
.menu b{display:block;font-size:18px;margin-bottom:4px}.menu small{color:var(--mu)}
.lang{text-align:left;position:relative;overflow:hidden}
.lang .em{font-size:30px}.lang b{display:block;margin-top:6px}
.stars{letter-spacing:4px;color:var(--line);font-size:18px;margin-top:6px}.stars .on{color:var(--star);text-shadow:0 0 10px var(--star)}
.done-tag{position:absolute;top:10px;right:12px;color:var(--ok);font-size:12px}
.auth{max-width:420px;margin:8vh auto 0}
.auth input,.srch{width:100%;background:#0d1230;border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:12px;font:inherit;margin:6px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1}.tabs .sel{background:var(--acc);color:#0b1030;border-color:var(--acc);font-weight:700}
.err{color:var(--bad);font-size:13px;min-height:18px}.note{color:var(--mu);font-size:12px;margin-top:10px}
.sec{margin:18px 0 8px;color:var(--mu);font-size:14px}
code,pre{font-family:Consolas,'Courier New',monospace}
pre{background:#070a19;border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;font-size:14px;line-height:1.7;margin:10px 0}
.blank{background:var(--star);color:#241a00;border-radius:6px;padding:0 10px}
.learn{border-left:3px solid var(--acc);background:#10163a;padding:12px 14px;border-radius:0 12px 12px 0;color:var(--mu);margin:10px 0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.opts button{font-family:Consolas,'Courier New',monospace;font-size:14px}
.opts .right{background:#0f3d38;border-color:var(--ok)}.opts .wrong{background:#431726;border-color:var(--bad);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tiles{display:flex;flex-direction:column;gap:8px;margin:8px 0}.tiles button{text-align:left;font-family:Consolas,'Courier New',monospace;font-size:13px;white-space:pre}
.ans{min-height:56px;border:1px dashed var(--line);border-radius:12px;padding:8px;margin:8px 0}
.bar{height:8px;background:#0d1230;border-radius:9px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--star));transition:width .4s}
.fb{padding:12px 14px;border-radius:12px;margin:10px 0}.fb.ok{background:#0f3d38;border:1px solid var(--ok)}.fb.no{background:#431726;border:1px solid var(--bad)}
.hint{background:#2a2410;border:1px solid var(--star);color:#ffe9a8;padding:10px 14px;border-radius:12px;margin:10px 0}
.modal{position:fixed;inset:0;background:#030510dd;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{max-width:560px;max-height:90vh;overflow:auto;width:100%}
.modal ol,.card ul{padding-left:20px;color:var(--mu)}.modal li,.card li{margin:5px 0}
.win{text-align:center}.win h2{font-size:30px;color:var(--star)}
#conf{position:fixed;inset:0;z-index:30;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="sky"></canvas><canvas id="conf"></canvas>
<div id="app"></div>

re:[["Find the bug","Never change state directly. Always call the setter so React knows to redraw.","What is wrong here?",'function C() {\n  const [n, setN] = useState(0);\n  return <button onClick={() => { n = n + 1 }}>{n}</button>;\n}',["State must be changed with setN, not assigned","useState needs two arguments","The button needs a key","JSX cannot show numbers"],0,"Which function changes state?","n is a constant and assigning to it also would not trigger a redraw. Use setN(n + 1)."],

html:[["Semantic HTML","Semantic tags tell browsers and screen readers what a block means.","Pick the tag meant for main navigation links.",'<___>\n  <a href="/">Home</a>\n</___>',["nav","div","section","span"],0,"It is short for navigation.","<nav> marks a navigation area, which helps accessibility."],
["Accessibility","Alt text lets people who cannot see an image understand it.","What is missing here?",'<img src="logo.png">',["An alt attribute","A title tag","A class name","A width"],0,"Screen readers read this aloud.","Images need alt text describing them, or alt=\"\" if purely decorative."],
["Boss: a form","Labels linked to inputs with for/id make forms usable and accessible.","Arrange a complete form.",null,['<form action="/save" method="post">','  <label for="n">Name</label>','  <input id="n" name="n">','  <button type="submit">Send</button>','</form>'],-1,"Form wraps everything; label comes before its input.","label for=\"n\" connects to input id=\"n\"."]],

["Shorthand","margin with two values sets vertical then horizontal.","What does this mean?",'margin: 10px 20px;',["10px top and bottom, 20px left and right","10px left and right, 20px top and bottom","10px on all sides","10px top, 20px bottom"],0,"First value is up/down.","Two values: vertical first, then horizontal."],
["Boss: Grid","Grid makes rows and columns. fr means a fraction of the free space.","Make 3 equal-width columns.",'.grid {\n  display: grid;\n  grid-template-columns: repeat(3, ___);\n}',["1fr","100%","3px","flex"],0,"A fraction unit.","repeat(3, 1fr) creates three columns that share the width equally."]],

["JOIN","A JOIN combines rows from two tables where a condition matches.","Combine users and their orders.",'SELECT u.name, o.total\nFROM users u\n___ orders o ON u.id = o.user_id;',["JOIN","MERGE","UNION","LINK"],0,"The standard keyword for combining tables.","JOIN (INNER JOIN) matches rows by the ON condition. UNION stacks results instead."],

const XP=20,HINT=5,HEARTS=3;

/* ---------- STATE ---------- */
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
let user=null,P=null,G=null,view="auth",mode="in",err="";
const blank=()=>({xp:0,done:{},best:{}});
const lk=()=>{try{return JSON.parse(localStorage.getItem("sc_users")||"{}")}catch(e){return{}}};
const hash=t=>{let h=5381;for(const c of t)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
function save(){try{localStorage.setItem("sc_p_"+user.uid,JSON.stringify(P))}catch(e){}}
function load(){let p=null;try{p=JSON.parse(localStorage.getItem("sc_p_"+user.uid)||"null")}catch(e){}
  p=p||blank();p.done=p.done||{};p.best=p.best||{};P=p}
function auth(){
  const name=$("#nm")?$("#nm").value.trim():"",em=$("#em").value.trim().toLowerCase(),pw=$("#pw").value;err="";
  if(!em||!pw||(mode==="up"&&!name)){err="Please fill in every field.";return render()}
  if(!/^\S+@\S+\.\S+$/.test(em)){err="Enter a valid email address.";return render()}
  if(pw.length<6){err="Use a password with at least 6 characters.";return render()}
  const u=lk();
  if(mode==="up"){if(u[em]){err="That email already has an account. Sign in instead.";return render()}
    u[em]={name,pw:hash(pw),uid:"u_"+hash(em)};try{localStorage.setItem("sc_users",JSON.stringify(u))}catch(e){}}
  else if(!u[em]||u[em].pw!==hash(pw)){err="Wrong email or password.";return render()}
  user={uid:u[em].uid,name:u[em].name,email:em};
  try{localStorage.setItem("sc_session",em)}catch(e){}
  load();view="home";render();
}
function out(){try{localStorage.removeItem("sc_session")}catch(e){}user=P=G=null;view="auth";mode="in";render()}

/* ---------- RENDER ---------- */
const stat=()=>`<div class="stats"><span class="chip">⭐ ${P.xp} XP</span><span class="chip">🏅 ${Object.keys(P.done).length}/${Object.keys(L).length} complete</span></div>`;
const hdr=(b)=>`<div class="top"><div class="logo">Star<span>Code</span> ✦</div>${user?stat():""}<div class="row">${b||""}${user?`<button class="ghost" onclick="go('home')">Home</button><button class="ghost" onclick="out()">Sign out</button>`:""}</div></div>`;
window.go=v=>{view=v;G=null;render();scrollTo(0,0)};window.out=out;window.auth=auth;
window.setMode=m=>{mode=m;err="";render()};
function render(){const A=$("#app");
if(view==="auth"){A.innerHTML=`${hdr()}<div class="card auth"><h2>${mode==="in"?"Welcome back":"Create your account"}</h2><p class="note" style="margin:4px 0 14px">Learn to code in small night-sky quests. Your progress is saved to your account.</p>
<div class="tabs"><button class="${mode==="in"?"sel":""}" onclick="setMode('in')">Sign in</button><button class="${mode==="up"?"sel":""}" onclick="setMode('up')">Sign up</button></div>
${mode==="up"?'<label>Your name<input id="nm" autocomplete="name"></label>':""}
<label>Email<input id="em" type="email" autocomplete="email"></label><label>Password<input id="pw" type="password" autocomplete="${mode==="in"?"current-password":"new-password"}" onkeydown="event.key==='Enter'&&auth()"></label>
<div class="err">${err}</div><button class="pri" style="width:100%" onclick="auth()">${mode==="in"?"Sign in":"Sign up"}</button>
<p class="note">Works offline. Your account and progress are saved in this browser on this device.</p></div>`;return}
if(view==="home"){A.innerHTML=`${hdr()}<div class="card hero"><h1>Hi ${esc(P.name||user.name)}, ready to level up?</h1><p>Each game is a short quest. You learn one idea, solve a puzzle, earn XP and light up a star. Finish every star to complete the language.</p><button class="pri" onclick="go('games')">Open Games</button></div>
<div class="menu"><button onclick="go('games')"><b>🎮 Games</b><small>${Object.keys(L).length} languages to play</small></button><button onclick="go('doubt')"><b>💡 Doubt Clearer</b><small>Search any concept and see an explained example</small></button><button onclick="go('done')"><b>🏆 Completed Sessions</b><small>${Object.keys(P.done).length} finished</small></button><button onclick="help()"><b>❓ How it works</b><small>XP, hearts, hints and refresh</small></button></div>`;return}
if(view==="games"){A.innerHTML=`${hdr()}<h2>Choose a game</h2><p class="sec">Pick a language. You'll get a full briefing before you start.</p><div class="grid">${Object.entries(L).map(([k,l])=>`<button class="card lang" onclick="brief('${k}')">${P.done[k]?'<span class="done-tag">✔ complete</span>':""}<span class="em">${l.e}</span><b>${l.n}</b><span class="note">${l.lv.length} ${l.big?"questions · Basic to Hard":"levels · Easy, Hard, Boss"}</span><div class="stars">${(l.big?Array.from({length:10}):l.lv).map((_,i)=>`<span class="${P.done[k]||(P.best[k]||0)>(l.big?i*4:i)?"on":""}">★</span>`).join("")}</div></button>`).join("")}</div>`;return}
if(view==="brief"){const l=L[G.k];A.innerHTML=`${hdr()}<div class="card"><h2>${l.e} ${l.n} quest</h2>
<p class="sec">Before you start</p><p>This is a learning game, not just a quiz. Each level teaches one real ${l.n} idea in a short note, then asks you to use it. Every answer comes with an explanation, so even mistakes teach you something.</p>
<p class="sec">How to play</p><ul>${l.big?'<li>40 questions climb from <b>Basic</b> to <b>Medium</b> to <b>Hard</b>.</li><li>You will meet <b>multiple choice</b>, <b>true or false</b> and <b>explain the method</b> questions. Each correct answer comes with an explanation.</li><li>You have 5 ❤️. A wrong answer costs one; at zero you restart from your last checkpoint (every 10 questions).</li>':`<li>Read the <b>Learn</b> note, then look at the code.</li><li>Pick the option that fills the <span class="blank">&nbsp;&nbsp;</span> gap — or tap lines to put them in the right order and press <b>Check</b>.</li><li>You have ${HEARTS} ❤️ hearts. A wrong answer costs one; at zero you restart the quest.</li>`}</ul>
<p class="sec">Tools you can use</p><ul><li>💡 <b>Hint</b> — a nudge, costs ${HINT} XP.</li><li>🔄 <b>Refresh</b> — resets this level and reshuffles it, free.</li><li>🙋 <b>Doubt</b> — opens the full concept explanation anytime.</li></ul>
<p class="sec">What you gain</p><ul>${l.big?'<li>XP per correct answer: 10 on Basic, 15 on Medium, 25 on Hard (half if you use a hint or Doubt)</li>':'<li>XP for each correct answer: 20 on Easy levels, 30 on Hard, 50 on the Boss level (half if you use a hint)</li><li>Harder levels ask you to predict output, find bugs and build code in order</li>'}<li>A lit star per level, and a spot in Completed Sessions with a celebration.</li></ul>
<div class="row" style="margin-top:18px"><button class="ghost" onclick="go('games')">Back</button><button class="pri" onclick="start('${G.k}')">Start the quest</button></div></div>`;return}
if(view==="play"){play();return}
if(view==="doubt"){A.innerHTML=`${hdr()}<h2>Doubt Clearer</h2><p class="sec">Type a word (like loop, state, WHERE) or pick a language.</p><input class="srch" id="q" placeholder="Search a concept…" oninput="dq()"><div id="dr"></div>`;dq();return}
if(view==="done"){const d=Object.entries(P.done);A.innerHTML=`${hdr()}<h2>Completed Sessions</h2>${d.length?`<div class="grid" style="margin-top:12px">${d.map(([k,v])=>`<div class="card"><span style="font-size:30px">${L[k].e}</span><h3>${L[k].n}</h3><p class="note">Finished ${new Date(v.date).toLocaleDateString()}<br>${v.xp} XP earned · ${"❤️".repeat(v.hearts)||"💔"} left</p><div class="stars"><span class="on">${"★".repeat(Math.min(10,L[k].lv.length))}</span></div></div>`).join("")}</div>`:`<div class="card"><p>Nothing here yet. Finish all levels of a game and it will appear here.</p><button class="pri" style="margin-top:12px" onclick="go('games')">Pick a game</button></div>`}`}
}
window.dq=()=>{const q=($("#q")?.value||"").toLowerCase();const r=[];
for(const[k,l]of Object.entries(L))for(const v of l.lv){const tx=Array.isArray(v)?l.n+v[0]+v[1]+v[3]:l.n+v.q+v.w;if(!q||tx.toLowerCase().includes(q))r.push([l,v])}
$("#dr").innerHTML=r.length?r.slice(0,30).map(([l,v])=>Array.isArray(v)?`<div class="card" style="margin-bottom:12px"><b>${l.e} ${l.n} · ${esc(v[0])}</b><div class="learn">${esc(v[1])}</div>${v[3]?`<pre>${esc(v[3].replace("___",v[4][v[5]]))}</pre>`:`<pre>${esc(v[4].join("\n"))}</pre>`}<p class="note">${esc(v[7])}</p></div>`:`<div class="card" style="margin-bottom:12px"><b>${l.e} ${l.n}</b><p style="margin:6px 0">${esc(v.q)}</p><div class="learn"><b>Answer:</b> ${esc(v.t==="t"?(v.v?"True":"False"):v.o[0])}<br>${esc(v.w)}</div></div>`).join("")+(r.length>30?`<p class="note">Showing 30 of ${r.length}. Type more letters to narrow it down.</p>`:""):`<div class="card">No match. Try a shorter word like "list" or "loop".</div>`};
window.help=()=>{const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card"><h2>How StarCode works</h2><ol><li><b>Games</b> → choose a language → read the briefing.</li><li>Each level: learn a note, then solve the puzzle.</li><li><b>Hint</b> costs ${HINT} XP. <b>Refresh</b> reshuffles the level. <b>Doubt</b> shows the full explanation.</li><li>Wrong answers cost a ❤️. Zero hearts restarts the quest.</li><li>Finish every level to celebrate and unlock the language in <b>Completed Sessions</b>.</li></ol><button class="pri" style="margin-top:14px" onclick="this.closest('.modal').remove()">Got it</button></div>`;document.body.append(m)};

window.brief=k=>{G={k};view="brief";render()};
window.start=k=>{G={k,i:0,h:L[k].big?5:HEARTS,xp:0};view="play";lvl();render()};
function lvl(){const v=L[G.k].lv[G.i];if(!Array.isArray(v)){G.o=v.t==="t"?[["True",0],["False",1]]:shuf(v.o.map((t,j)=>[t,j]))}else G.o=shuf(v[4].map((t,j)=>[t,j]));G.rm=[];G.pick=[];G.fb=null;G.hint=false;G.hu=false;G.lock=false;G.w=null}
function playN(l,v){const c=v.t==="t"?(v.v?0:1):0,tr=ntier(G.i),n=l.lv.length;
$("#app").innerHTML=`${hdr()}<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h3>${l.e} ${l.n} · Question ${G.i+1}/${n}</h3><span class="chip">${tr[0]} · ${v.t==="t"?"True or false":"Multiple choice"}</span><span class="chip">${"❤️".repeat(G.h)||"💔"}</span></div><div class="bar"><i style="width:${G.i/n*100}%"></i></div>
<p style="font-size:18px;margin:12px 0">${esc(v.q)}</p>
<div class="opts" style="grid-template-columns:${v.t==="t"?"1fr 1fr":"repeat(auto-fit,minmax(220px,1fr))"}">${G.o.filter(([t,j])=>!G.rm.includes(j)).map(([t,j])=>`<button style="font-family:inherit" class="${G.fb&&G.fb.ok&&j===c?"right":G.w===j?"wrong":""}" ${G.lock?"disabled":""} onclick="an(${j})">${esc(t)}</button>`).join("")}</div>
${G.hint?`<div class="hint">💡 ${v.t==="t"?"Ask yourself: is there any exception that makes this statement false?":"Two wrong answers were removed."}</div>`:""}
${G.fb?`<div class="fb ${G.fb.ok?"ok":"no"}"><b>${G.fb.ok?"Correct! +"+G.fb.xp+" XP":"Not quite. Try again."}</b>${G.fb.ok?"<br>"+esc(v.w):""}</div>`:""}
<div class="row" style="justify-content:flex-start;margin-top:10px"><button onclick="hint()" ${G.lock?"disabled":""}>💡 Hint (−${HINT} XP)</button><button onclick="ref()">🔄 Refresh</button><button onclick="doubt()">🙋 Doubt</button>${G.lock&&G.fb?.ok?`<button class="pri" onclick="nxt()">${G.i+1===n?"Finish quest 🎉":"Next question →"}</button>`:""}</div><p class="note">Quest XP: ${G.xp} · checkpoint every 10 questions</p></div>`}
window.an=j=>{const v=L[G.k].lv[G.i],c=v.t==="t"?(v.v?0:1):0;j===c?good():bad(j)};
window.cp=()=>{G.i=Math.floor(G.i/10)*10;G.h=5;lvl();view="play";render()};
function play(){const l=L[G.k],v=l.lv[G.i];if(!Array.isArray(v))return playN(l,v);const ord=!v[3];
$("#app").innerHTML=`${hdr()}<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h3>${l.e} ${l.n} · ${tier(G.i)[0]} · Level ${G.i+1}/${l.lv.length}: ${esc(v[0])}</h3><span class="chip">${"❤️".repeat(G.h)||"💔"}</span></div>
<div class="bar"><i style="width:${G.i/l.lv.length*100}%"></i></div>
<div class="learn"><b>Learn:</b> ${esc(v[1])}</div><p><b>Task:</b> ${esc(v[2])}</p>
${ord?`<div class="ans">${G.pick.map(j=>`<button class="tl" onclick="unp(${j})" style="font-family:Consolas,'Courier New',monospace;font-size:13px;white-space:pre;margin:2px">${esc(v[4][j])}</button>`).join("")||'<span class="note">Tap lines below in order…</span>'}</div><div class="tiles">${G.o.filter(([t,j])=>!G.pick.includes(j)).map(([t,j])=>`<button onclick="pk(${j})">${esc(t)}</button>`).join("")}</div>`
:`<pre>${esc(v[3]).replace("___",'<span class="blank">&nbsp;?&nbsp;</span>')}</pre><div class="opts">${G.o.map(([t,j])=>`<button class="${G.fb&&j===v[5]?"right":G.w===j?"wrong":""}" ${G.lock?"disabled":""} onclick="ans(${j})">${esc(t)}</button>`).join("")}</div>`}
${G.hint?`<div class="hint">💡 ${esc(v[6])}</div>`:""}${G.fb?`<div class="fb ${G.fb.ok?"ok":"no"}"><b>${G.fb.ok?"Correct! +"+G.fb.xp+" XP":"Not quite."}</b><br>${esc(v[7])}</div>`:""}
<div class="row" style="justify-content:flex-start;margin-top:10px">${ord&&!G.lock?`<button class="pri" onclick="chk()" ${G.pick.length!==v[4].length?"disabled":""}>Check</button>`:""}
<button onclick="hint()" ${G.lock?"disabled":""}>💡 Hint (−${HINT} XP)</button><button onclick="ref()">🔄 Refresh</button><button onclick="doubt()">🙋 Doubt</button>
${G.lock&&G.fb?.ok?`<button class="pri" onclick="nxt()">${G.i+1===l.lv.length?"Finish quest 🎉":"Next level →"}</button>`:""}${G.fb&&!G.fb.ok&&G.h>0&&!ord?`<span class="note">Try again…</span>`:""}</div>
<p class="note">Quest XP: ${G.xp}</p></div>`}
window.pk=j=>{G.pick.push(j);G.fb=null;render()};window.unp=j=>{G.pick=G.pick.filter(x=>x!==j);render()};
window.ref=()=>{G.h=G.h;lvl();render()};
window.hint=()=>{if(!G.hint){G.hint=true;G.hu=true;G.xp=Math.max(0,G.xp-HINT);const v=L[G.k].lv[G.i];if(!Array.isArray(v)&&v.t==="m")G.rm=shuf([1,2,3]).slice(0,2)}render()};
window.doubt=()=>{const v=L[G.k].lv[G.i],m=document.createElement("div");m.className="modal";if(!Array.isArray(v)){G.hu=true;m.innerHTML=`<div class="card"><h3>🙋 Doubt cleared</h3><p style="margin:8px 0">${esc(v.q)}</p><div class="learn"><b>Answer:</b> ${esc(v.t==="t"?(v.v?"True":"False"):v.o[0])}<br>${esc(v.w)}</div><p class="note">Using Doubt halves the XP for this question.</p><button class="pri" style="margin-top:12px" onclick="this.closest('.modal').remove()">Back to the game</button></div>`;document.body.append(m);return}m.innerHTML=`<div class="card"><h3>💡 ${esc(v[0])}</h3><div class="learn">${esc(v[1])}</div>${v[3]?`<pre>${esc(v[3].replace("___",v[4][v[5]]))}</pre>`:`<pre>${esc(v[4].join("\n"))}</pre>`}<p class="note">Full answer: ${esc(v[7])}</p><button class="pri" style="margin-top:12px" onclick="this.closest('.modal').remove()">Back to the game</button></div>`;document.body.append(m)};
window.ans=j=>{const v=L[G.k].lv[G.i];if(j===v[5]){good()}else bad(j)};
window.chk=()=>{const v=L[G.k].lv[G.i];G.pick.every((j,x)=>j===x)?good():bad(-1)};
function good(){const b=(L[G.k].big?ntier(G.i):tier(G.i))[1],g=G.hu?Math.ceil(b/2):b;G.xp+=g;G.fb={ok:true,xp:g};G.lock=true;render()}
function bad(j){G.h--;G.w=j;G.fb={ok:false};if(j<0)G.pick=[];
 if(G.h<=0){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card win"><h2 style="color:var(--bad)">Out of hearts 💔</h2><p>Every explorer falls sometimes. Review the Learn notes, then try the quest again.</p><div class="row" style="margin-top:14px"><button onclick="this.closest('.modal').remove();go('games')">Back to games</button>${L[G.k].big?`<button class="pri" onclick="this.closest('.modal').remove();cp()">Retry from checkpoint</button>`:`<button class="pri" onclick="this.closest('.modal').remove();start('${G.k}')">Restart quest</button>`}</div></div>`;document.body.append(m);render();return}
 render();setTimeout(()=>{if(G){G.w=null;G.fb=null;render()}},900)}
window.nxt=()=>{const l=L[G.k];
 if(G.i+1<l.lv.length){G.i++;P.best[G.k]=Math.max(P.best[G.k]||0,G.i);lvl();render();return}
 P.xp+=G.xp;P.done[G.k]={date:Date.now(),xp:G.xp,hearts:G.h};save();
 const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card win"><div style="font-size:60px">🏆</div><h2>You completed ${l.n}!</h2><p>${G.xp} XP earned · ${G.h} ❤️ left</p><p class="note" style="margin:8px 0 16px">Added to Completed Sessions on your home page.</p><div class="row"><button onclick="this.closest('.modal').remove();go('done')">See Completed Sessions</button><button class="pri" onclick="this.closest('.modal').remove();go('games')">Play another</button></div></div>`;document.body.append(m);confetti()};

/* ---------- STARS + CONFETTI ---------- */
const sk=$("#sky"),sx=sk.getContext("2d");let S=[];
function rs(){sk.width=innerWidth;sk.height=innerHeight;S=Array.from({length:110},()=>({x:Math.random()*sk.width,y:Math.random()*sk.height,r:Math.random()*1.4+.3,p:Math.random()*6}))}
rs();addEventListener("resize",rs);
(function tw(t){sx.clearRect(0,0,sk.width,sk.height);for(const s of S){sx.globalAlpha=.4+.5*Math.sin(t/900+s.p);sx.fillStyle="#cfd6ff";sx.beginPath();sx.arc(s.x,s.y,s.r,0,7);sx.fill()}requestAnimationFrame(tw)})(0);
function confetti(){const c=$("#conf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const cols=["#ffc857","#5eead4","#8b9bff","#fb7185","#fff"];
 const P2=Array.from({length:160},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-14-2,c:cols[Math.random()*5|0],s:Math.random()*7+3,a:1}));
 (function f(){x.clearRect(0,0,c.width,c.height);let alive=0;for(const p of P2){p.x+=p.vx;p.y+=p.vy;p.vy+=.32;p.a-=.006;if(p.a>0){alive++;x.globalAlpha=p.a;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s*.6)}}alive?requestAnimationFrame(f):x.clearRect(0,0,c.width,c.height)})()}

/* ---------- BOOT ---------- */
try{const em=localStorage.getItem("sc_session"),u=lk();
  if(em&&u[em]){user={uid:u[em].uid,name:u[em].name,email:em};load();view="home"}}catch(e){}
render();
})();
</script></body></html>
